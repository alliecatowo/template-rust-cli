pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    clippy:
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

commit-msg:
  skip: [merge, rebase]
  commands:
    conventional-commit:
      run: |
        head -1 "{1}" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo "commit subject must be a conventional commit, e.g. 'feat(scope): add thing'" >&2
          exit 1
        }
